<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Berkeley Clock Client</title>

    <!-- Tailwind Play CDN (phù hợp demo) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-3xl w-full bg-white rounded-2xl shadow-lg p-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-semibold">Thuật toán Berkeley — Client</h1>
          <p class="text-sm text-slate-500 mt-1">
            Kết nối tới server để đồng bộ đồng hồ
          </p>
        </div>
        <div>
          <span id="clientId" class="text-sm text-slate-600">ID: -</span>
        </div>
      </div>

      <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="p-4 bg-indigo-50 rounded-lg">
          <div class="text-xs text-slate-500">Đồng hồ (client)</div>
          <div id="clock" class="text-3xl font-mono mt-2">--:--:--</div>
          <div id="offsetText" class="text-sm text-slate-600 mt-2">
            Offset: 0 ms
          </div>
        </div>

        <div class="p-4 bg-emerald-50 rounded-lg">
          <div class="text-xs text-slate-500">Server time (last known)</div>
          <div id="serverTime" class="text-2xl font-mono mt-2">--:--:--</div>
          <div id="lastSync" class="text-sm text-slate-600 mt-2">
            Last sync: -
          </div>
        </div>

        <div class="p-4 bg-yellow-50 rounded-lg">
          <div class="text-xs text-slate-500">Trạng thái kết nối</div>
          <div id="status" class="text-lg mt-2">Disconnected</div>
          <div class="mt-3 flex gap-2">
            <button
              id="btnReq"
              class="px-3 py-1 bg-indigo-600 text-white rounded"
            >
              Yêu cầu gửi thời gian
            </button>
            <button
              id="btnAdjust"
              class="px-3 py-1 bg-green-600 text-white rounded"
            >
              Áp dụng điều chỉnh gần nhất
            </button>
          </div>
        </div>
      </div>

      <div class="mt-6">
        <h3 class="text-sm text-slate-500">Lịch sử</h3>
        <div
          id="logs"
          class="mt-2 h-36 overflow-auto bg-slate-100 rounded p-3 text-xs"
        ></div>
      </div>

      <div class="mt-6 text-right">
        <small class="text-slate-400"
          >Mở nhiều máy/trình duyệt để mô phỏng hệ phân tán — kết nối đến
          WebSocket server.</small
        >
      </div>
    </div>
    <script src="client.js"></script>
  </body>
</html>
